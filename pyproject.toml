[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleon"
version = "0.3.1"
description = "Headless, privacy-first email-automation engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2", "PyYAML>=6.0.4"]

[project.optional-dependencies]
dev = ["pytest", "bandit"]

[project.scripts]
nucleon = "nucleon.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/proton-drive-kit"]
testpaths = ["tests"]
