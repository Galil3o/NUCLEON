# Nucleon example configuration. Placeholder values only; copy and edit locally.
mail:
  id: my-account           # stable internal id (R-012): all state is bound to it, not the login.
                          # Unique per account; never reuse. A host/login change under the same id
                          # is refused until you set accept_identity_change: true for one run.
  accept_identity_change: false
  mode: imap
  host: 127.0.0.1
  port: 1143
  username: your-bridge-username   # password comes from the environment, never this file
  mailbox: INBOX
  since_days: 7
  limit: 50

classifier:
  endpoint: http://127.0.0.1:11434   # local model endpoint (default-allowed)
  model: your-model-name
  # PRIVACY BOUNDARY: subject, addresses and body text are sent to this endpoint.
  # A non-loopback endpoint needs allow_remote: true AND an https:// URL;
  # plaintext http to a remote host is rejected at config load.
  allow_remote: false

draft:
  target: outbox            # "outbox" or "drafts"
  label: nucleon/proposed

cleanup:
  auto_trash_enabled: false
  auto_trash_categories: []

labels:
  namespace: "nucleon/"   # model labels are only honoured inside this namespace
  allowed: []             # plus exact, operator-approved target folders (never system folders)

marker:                   # always on (idempotency); separate from the opt-in journal
  backend: file
  path: nucleon-state/processed.jsonl

journal:
  enabled: false
  backend: file
  path: null

analysis:                 # error analysis (DECISIONS section 5); off by default
  enabled: false          # Stage 2: one metadata-only record per failed message
                          # (error code, failing stage, duration, pseudonymised refs;
                          # NEVER subject/body/addresses/server replies/model text)
  path: nucleon-state/analysis.jsonl
  verbose: false          # Stage 3 (content): off; also needs a separate explicit
                          # per-message confirmation, never automatic; purged after the ttl
  verbose_path: nucleon-state/analysis-stage3.jsonl
  verbose_ttl_seconds: 900

limits:                   # size/count budgets (R-011); overruns are reported per message
  max_message_bytes: 10000000       # RFC822.SIZE checked BEFORE loading; over = message rejected
  max_body_bytes: 262144            # only the text part is fetched, up to this many bytes
  max_header_bytes: 65536
  max_model_response_bytes: 1048576 # HTTP response from the model endpoint
  max_model_input_chars: 32000      # body text sent to the model
  max_labels_per_message: 10
  max_actions_per_message: 20

registry_path: nucleon-state/accounts.json   # account id -> identity fingerprint (hashes only)
